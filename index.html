<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da leitura — Catavento</title>
<style>
  :root{
    --rosa:#ef3f8f; --rosa-claro:#fde7f1; --escuro:#3f3550;
    --creme:#fffaf7; --amarelo:#ffd166; --verde:#8fe0a2; --roxo:#8257d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Trebuchet MS","Verdana",sans-serif;background:var(--rosa-claro);
       color:var(--escuro);line-height:1.6;padding-bottom:50px}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}

  header{background:var(--rosa-claro);border-bottom:5px solid var(--escuro);padding:22px 0 18px;position:relative}
  h1{display:inline-block;background:var(--rosa);color:#fff;font-size:clamp(19px,4.2vw,30px);
     padding:11px 26px;border:4px solid var(--escuro);border-radius:40px;
     box-shadow:0 6px 0 var(--escuro);letter-spacing:.5px}
  .logo{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--escuro);
        border-radius:22px;padding:7px 16px;margin-top:14px;width:fit-content;max-width:100%}
  .logo img{height:34px;display:block}
  .logo span{font-size:13px;color:#7a6f88}
  .gato{position:absolute;right:18px;top:16px;width:96px}
  @media(max-width:700px){.gato{width:70px;top:auto;bottom:12px;right:10px}}

  /* barra de fases */
  .fases{display:flex;align-items:center;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
  .pin{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--escuro);
       display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}
  .pin.on{background:var(--amarelo);box-shadow:0 4px 0 var(--escuro)}
  .pin.done{background:var(--verde)}
  .pontos{margin-left:auto;font-size:15px;font-weight:bold;background:#fff;border:3px solid var(--escuro);
          border-radius:30px;padding:5px 16px}

  .card{background:var(--creme);border:4px solid var(--escuro);border-radius:20px;
        padding:20px 22px;box-shadow:0 6px 0 #e3d7e8;margin:14px 0 20px}
  .card.rosa{background:#fdf3f8}
  .card.amarelo{background:#fff6da}
  .card.roxo{background:#f4eeff}
  h2{font-size:21px;margin-top:6px}
  .dica{font-size:15px;color:#6f6482;margin-top:6px}
  p{font-size:16px}

  .enunciado{font-size:clamp(19px,4vw,27px);font-weight:bold;letter-spacing:1.4px;
             text-align:center;padding:16px 6px 6px}
  .vaga{display:inline-block;min-width:40px;border-bottom:5px solid var(--rosa);margin-left:4px}
  .lacuna{display:inline-block;min-width:44px;border-bottom:5px solid var(--rosa);margin:0 2px}

  .botoes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .bt{width:70px;height:70px;border-radius:50%;background:var(--amarelo);border:4px solid var(--escuro);
      box-shadow:0 6px 0 var(--escuro);font-size:30px;font-weight:bold;font-family:inherit;color:var(--escuro);
      cursor:pointer;padding-bottom:7px}
  .bt.larga{width:auto;min-width:96px;height:62px;border-radius:32px;font-size:23px;padding:0 20px}
  .bt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--escuro)}
  .bt:focus-visible{outline:4px solid var(--rosa);outline-offset:4px}
  .bt[disabled]{opacity:.45;cursor:default}

  .opcoes{display:flex;flex-direction:column;gap:11px;margin:12px 0 4px}
  .op{background:#fff;border:4px solid var(--escuro);border-radius:14px;padding:13px 15px;
      font-size:clamp(16px,3.2vw,20px);font-weight:bold;letter-spacing:.8px;color:var(--escuro);
      font-family:inherit;cursor:pointer;text-align:left;box-shadow:0 4px 0 #e3d7e8}
  .op:active{transform:translateY(3px);box-shadow:0 1px 0 #e3d7e8}
  .op:focus-visible{outline:4px solid var(--rosa);outline-offset:3px}
  .op.ok{background:#d8f5e2;border-color:#2e9e57}
  .op.no{background:#ffe0ec}
  .op[disabled]{cursor:default}

  .resposta{text-align:center;font-size:17px;font-weight:bold;min-height:52px;padding:8px 6px}
  .certo{color:#2e9e57}.errado{color:var(--rosa)}

  .parlenda{background:#fff;border:4px dashed var(--rosa);border-radius:18px;padding:20px;
            font-size:clamp(18px,3.8vw,25px);font-weight:bold;letter-spacing:1.4px;line-height:2}
  .parlenda span{display:block}
  .parlenda b{color:var(--rosa)}

  .avancar{background:var(--rosa);color:#fff;border:4px solid var(--escuro);border-radius:32px;
           padding:12px 28px;font-size:17px;font-weight:bold;font-family:inherit;cursor:pointer;
           box-shadow:0 5px 0 var(--escuro);display:block;margin:6px auto 0}
  .avancar:active{transform:translateY(3px);box-shadow:0 2px 0 var(--escuro)}
  .fim{text-align:center}
  .medalha{font-size:56px;line-height:1.2}
  .faixa{height:20px;background:var(--verde);border-top:4px solid var(--escuro);margin-top:34px}
  footer{text-align:center;font-size:13px;color:#8d819c;margin-top:12px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    aviso: "Fale a palavra bem devagar e escute o som do R.",
    tipo: "escolha",
    itens: [
      {t:"RATO", ops:["Som forte","Som fraco"], c:0, d:"O R no começo da palavra é sempre forte."},
      {t:"ARARA", ops:["Som forte","Som fraco"], c:1, d:"Um R sozinho entre vogais fica fraquinho."},
      {t:"CARRO", ops:["Som forte","Som fraco"], c:0, d:"RR entre vogais é som forte."},
      {t:"PERA", ops:["Som forte","Som fraco"], c:1, d:"Um R só entre vogais: som fraco."},
      {t:"ROSA", ops:["Som forte","Som fraco"], c:0, d:"Começou com R: som forte."}
    ]
  },
  {
    nome: "A parlenda",
    aviso: "Leia a parlenda em voz alta, batendo palma no ritmo. Depois responda.",
    tipo: "parlenda",
    itens: [
      {t:"Quem correu no muro?", ops:["O CARRO","O RATO","A ROSA"], c:1, d:"A primeira linha conta isso."},
      {t:"O que o carro fez?", ops:["PULOU","CORREU","BUZINOU"], c:2, d:"Está na segunda linha."},
      {t:"Qual linha é uma pergunta?", ops:["O CARRO BUZINOU!","CADÊ O RATO?","QUE SUSTO, RATINHO!"], c:1,
       d:"Ela termina com o ponto de interrogação."},
      {t:"Por que a linha QUE SUSTO, RATINHO! termina com !?", ops:["Porque é uma pergunta","Porque tem emoção","Porque é o fim da história"], c:1,
       d:"A exclamação mostra susto, alegria ou surpresa."},
      {t:"Quantas vezes a palavra RATO aparece na parlenda?", ops:["DUAS","TRÊS","QUATRO"], c:1,
       d:"Aparece nas linhas 1, 3 e 4."},
      {t:"Na parlenda, qual palavra tem o som forte do R entre vogais?", ops:["MURO","CARRO","RATO"], c:1,
       d:"CARRO tem RR, que é som forte. Em RATO o R está no começo."}
    ]
  }
];

/* ---------------- motor do jogo ---------------- */

let fase = 0, item = 0, pontos = 0, travado = false;
const palco = document.getElementById('palco');
const barra = document.getElementById('fases');

function pintarBarra(){
  barra.innerHTML = FASES.map((f,k)=>
    `<div class="pin ${k<fase?'done':''} ${k===fase?'on':''}">${k+1}</div>`).join("")
    + `<div class="pontos">${pontos} pontos</div>`;
}

function totalItens(){ return FASES.reduce((s,f)=>s+f.itens.length,0); }

function mostrar(){
  pintarBarra();
  const f = FASES[fase];
  const q = f.itens[item];
  let corpo = "";

  if (f.tipo === "parlenda"){
    corpo += `<div class="parlenda">${PARLENDA.map(l=>`<span>${l}</span>`).join("")}</div>`;
  }

  if (f.tipo === "sinal"){
    corpo += `<div class="enunciado">${q.t}<span class="vaga"></span></div>
      <div class="botoes">
        <button class="bt" data-v=".">.</button>
        <button class="bt" data-v="!">!</button>
        <button class="bt" data-v="?">?</button>
      </div>`;
  } else if (f.tipo === "rr"){
    corpo += `<div class="enunciado">${q.a}<span class="lacuna"></span>${q.b}</div>
      <div class="botoes">
        <button class="bt larga" data-v="R">R</button>
        <button class="bt larga" data-v="RR">RR</button>
      </div>`;
  } else {
    corpo += `<div class="enunciado">${q.t}</div>
      <div class="opcoes">${q.ops.map((o,k)=>`<button class="op" data-v="${k}">${o}</button>`).join("")}</div>`;
  }

  palco.innerHTML = `
    <div class="card ${fase%2?'rosa':(f.tipo==='parlenda'?'roxo':'')}">
      <h2>Fase ${fase+1} — ${f.nome}</h2>
      <p class="dica">${f.aviso}</p>
      ${corpo}
      <div class="resposta" id="fb">Pergunta ${item+1} de ${f.itens.length}</div>
    </div>`;

  travado = false;
  palco.querySelectorAll('.bt, .op').forEach(b=>
    b.addEventListener('click', ()=>responder(b, b.dataset.v)));
}

function responder(botao, valor){
  if (travado) return;
  travado = true;
  const f = FASES[fase], q = f.itens[item];
  const fb = document.getElementById('fb');
  const botoes = palco.querySelectorAll('.bt, .op');
  botoes.forEach(b=>b.disabled = true);

  let acertou;
  if (f.tipo === "sinal"){
    acertou = (valor === q.r);
    palco.querySelector('.enunciado').innerHTML = q.t + q.r;
  } else if (f.tipo === "rr"){
    acertou = (valor === q.r);
    palco.querySelector('.enunciado').textContent = q.w;
  } else {
    acertou = (Number(valor) === q.c);
    const ops = palco.querySelectorAll('.op');
    ops[q.c].classList.add('ok');
    if (!acertou) botao.classList.add('no');
  }

  if (acertou){
    pontos++;
    fb.className = "resposta certo";
    fb.textContent = "Isso mesmo! " + q.d;
  } else {
    fb.className = "resposta errado";
    fb.textContent = q.d;
  }
  pintarBarra();

  const bt = document.createElement('button');
  bt.className = "avancar";
  const ultimo = (item === f.itens.length-1) && (fase === FASES.length-1);
  bt.textContent = ultimo ? "Ver meu resultado" : "Continuar";
  bt.addEventListener('click', proxima);
  palco.querySelector('.card').appendChild(bt);
  bt.focus();
}

function proxima(){
  const f = FASES[fase];
  item++;
  if (item < f.itens.length){ mostrar(); return; }
  item = 0; fase++;
  if (fase < FASES.length) mostrar(); else fim();
}

function fim(){
  pintarBarra();
  const total = totalItens();
  const estrelas = pontos >= total-2 ? "★★★" : pontos >= total/2 ? "★★" : "★";
  palco.innerHTML = `
    <div class="card amarelo fim">
      <div class="medalha">${estrelas}</div>
      <h2>Fim de jogo!</h2>
      <p style="margin-top:8px">Você fez ${pontos} pontos de ${total}.</p>
      <p style="margin-top:10px">Agora leia a parlenda mais uma vez, bem alto, fazendo a voz certinha em cada sinal.</p>
      <div class="parlenda" style="margin-top:14px">${PARLENDA.map(l=>`<span>${l}</span>`).join("")}</div>
      <button class="avancar" id="denovo">Jogar de novo</button>
    </div>`;
  document.getElementById('denovo').addEventListener('click', ()=>{
    fase = 0; item = 0; pontos = 0; mostrar();
  });
}

mostrar();
</script>
</body>
</html>
